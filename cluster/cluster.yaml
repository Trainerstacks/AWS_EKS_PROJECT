apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: spring-test-cluster
  region: ap-southeast-2
  version: "1.36"
vpc:
  id: "vpc-099a0995c62ca69ad"
  subnets:
    private:
      ap-southeast-2a:
        id: "subnet-0315ad99482b0d716"
      ap-southeast-2b:
        id: "subnet-0a5daa46133a585f8"
    public:
      ap-southeast-2a:
        id: "subnet-0666733ce6e7e23e0"
      ap-southeast-2b:
        id: "subnet-05383bf157fbffe4c"
managedNodeGroups:
  - name: ng-1
    labels: { role: worker }
    instanceType: m7i-flex.large
    desiredCapacity: 1
    minSize: 1
    maxSize: 3
    privateNetworking: true
    ssh:
      allow: true
      publicKeyName: ec2-db-key-pair123
    iam:
      withAddonPolicies:
        imageBuilder: true
        awsLoadBalancerController: true
        autoScaler: true
iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      attachPolicyARNs:
        - "arn:aws:iam::294951922097:policy/AWSLoadBalancerControllerIAMPolicy"
